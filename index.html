<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#062f4f">
  <title>Outcomes B2</title>
  <style>
    :root{--deep:#041f36;--navy:#06395b;--ocean:#075f82;--aqua:#18c6cf;--foam:#eafcff;--panel:rgba(255,255,255,.92);--ink:#062b44;--muted:#55768a;--line:#b9e8ee;--shadow:0 20px 55px rgba(2,45,70,.15);--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 8%,rgba(36,224,223,.25),transparent 27%),radial-gradient(circle at 58% 85%,rgba(7,95,130,.13),transparent 38%),linear-gradient(145deg,#f7feff 0%,#e2f8fb 50%,#c8edf4 100%)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:292px minmax(0,1fr)}
    aside{position:sticky;top:0;height:100vh;padding:29px 20px;color:white;display:flex;flex-direction:column;gap:25px;background:linear-gradient(165deg,var(--deep),var(--navy) 53%,var(--ocean));box-shadow:12px 0 42px rgba(2,38,61,.24);overflow:hidden}
    aside:before,aside:after{content:"";position:absolute;border:1px solid rgba(86,235,238,.18);border-radius:50%;pointer-events:none}aside:before{width:260px;height:260px;left:-120px;bottom:9%}aside:after{width:150px;height:150px;right:-75px;top:16%}
    .brand{position:relative;padding:8px 10px 23px;border-bottom:1px solid rgba(255,255,255,.12)}.brand small{display:block;margin-bottom:8px;color:#8debf0;font-weight:800;font-size:11px;letter-spacing:.19em;text-transform:uppercase}.brand strong{font-size:28px;letter-spacing:-.03em}.brand p{margin:7px 0 0;color:#b9eaf0;font-size:13px;line-height:1.5}
    nav{position:relative;display:grid;gap:8px}.nav-btn{border:0;border-radius:13px;padding:13px 14px;color:#dcf8fb;background:transparent;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s}.nav-btn:hover{background:rgba(255,255,255,.11)}.nav-btn.active{color:#032a40;background:linear-gradient(135deg,#65edf0,#24cbd5);box-shadow:0 8px 24px rgba(25,210,217,.22)}.nav-btn span{width:23px;text-align:center}.side-note{position:relative;margin-top:auto;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:15px;color:#b9eaf0;background:rgba(255,255,255,.055);font-size:12px;line-height:1.5}
    main{padding:36px clamp(20px,4vw,58px) 64px;overflow:hidden}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:30px}.eyebrow{margin-bottom:8px;color:#087c9c;font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(34px,5vw,58px);line-height:.98;letter-spacing:-.05em}.book-badge{min-width:190px;padding:16px 19px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}.book-badge strong{display:block}.book-badge span{color:var(--muted);font-size:12px}
    .units-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:34px}.unit-chip{min-height:86px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 6px 20px rgba(5,68,96,.05);text-align:left;cursor:pointer;transition:.2s}.unit-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.unit-chip.active{border-color:#1ab9c7;background:linear-gradient(145deg,#effeff,#d7f8fa)}.unit-number{color:#087c9c;font-size:12px;font-weight:900}.unit-chip-title{display:block;margin-top:10px;color:var(--ink);font-size:15px;font-weight:850}.blank-line{height:9px;margin-top:13px;border-radius:999px;background:#d7edf1}.blank-line.short{width:55%;margin-top:8px;background:#e4f3f5}
    .card{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}.unit-hero{display:grid;grid-template-columns:minmax(210px,.75fr) minmax(350px,1.45fr);gap:28px;padding:29px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(213,248,250,.88))}.unit-title{display:flex;align-items:center;min-height:158px}.unit-pill{display:inline-flex;padding:7px 12px;border-radius:999px;color:white;background:linear-gradient(135deg,#0d91ad,#16c5ce);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.unit-main-title{margin:17px 0 0;font-size:clamp(37px,5vw,65px);line-height:.95;letter-spacing:-.055em}.title-placeholder{width:min(250px,85%);height:48px;margin-top:18px;border-radius:12px;background:linear-gradient(90deg,#c8e9ee,#e4f5f7)}
    .categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.category{min-height:94px;padding:17px;border:1px solid #c1e9ee;border-radius:15px;background:rgba(255,255,255,.76)}.category.empty:before{content:"";display:block;width:40%;height:8px;margin-bottom:16px;border-radius:999px;background:#65cbd6}.category.empty:after{content:"";display:block;width:82%;height:8px;border-radius:999px;background:#d9eff2;box-shadow:0 15px 0 #e3f3f5}.category h3{margin:0 0 10px;color:#087c9c;font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.category ul{margin:0;padding-left:19px;color:#345b70;font-size:13px;line-height:1.5}.category li+li{margin-top:3px}.category p{margin:0;color:#345b70;font-size:13px;line-height:1.5}.category p strong{color:var(--ink)}
    .lessons{padding:27px 29px 31px}.section-placeholder{width:180px;height:20px;margin:0 0 20px;border-radius:8px;background:#cde9ed}.lesson-row{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(260px,1.25fr) minmax(150px,.8fr);gap:12px;margin-bottom:12px}.ghost-btn{min-height:55px;padding:14px 17px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:white;text-align:left;cursor:pointer;transition:.2s}.ghost-btn:hover{transform:translateY(-1px);border-color:#45c6d2;background:#f4feff}.ghost-btn.lesson{font-weight:850}.ghost-btn.lesson.empty{position:relative}.ghost-btn.lesson.empty:after{content:"";position:absolute;left:18px;right:30%;top:23px;height:9px;border-radius:99px;background:#d5eaee}.practice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ghost-btn.soft{color:#087697;font-weight:850;background:#eafafd}.ghost-btn.dashed{color:#496d7d;font-weight:750;border-style:dashed}.ghost-btn.reference{grid-column:1/-1;min-height:42px;color:#285b70;font-weight:850;border-left:4px solid #50cbd6;background:#f8feff}.ghost-btn.vocab{color:white;font-weight:850;border-color:transparent;background:linear-gradient(135deg,#16cbd2,#087697);box-shadow:0 9px 22px rgba(7,118,151,.2)}.optional-label{display:block;margin-top:3px;color:#6e8e9c;font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.assessment{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.assessment button{width:100%;height:58px;border:0;border-radius:14px;background:linear-gradient(135deg,#063d61,#087b95);cursor:pointer;box-shadow:0 10px 24px rgba(4,55,83,.18)}
    .placeholder{min-height:500px;display:grid;place-items:center;border:1px dashed #85ccd5;border-radius:var(--radius);background:rgba(255,255,255,.75)}.bubble{width:74px;height:74px;border:2px solid #70d5df;border-radius:50%;box-shadow:28px -34px 0 -22px #21b9c8,-30px 24px 0 -27px #087c9c}
    [hidden]{display:none!important}.toast{position:fixed;right:25px;bottom:25px;padding:13px 17px;border-radius:13px;color:white;background:#063d61;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:980px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:10;inset:auto 0 0;height:auto;padding:10px 12px}.brand,.side-note{display:none}nav{display:flex;overflow-x:auto}.nav-btn{flex:0 0 auto;font-size:12px}main{padding-bottom:108px}.units-grid{grid-template-columns:repeat(2,1fr)}.unit-hero{grid-template-columns:1fr}}
    @media(max-width:650px){.topbar{flex-direction:column}.book-badge{width:100%}.units-grid{grid-template-columns:1fr 1fr}.categories,.lesson-row{grid-template-columns:1fr}.unit-hero,.lessons{padding:22px}.title-placeholder{height:38px}.unit-title{min-height:105px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><small>Personal platform</small><strong>OUTCOMES B2</strong><p>Lessons, practice and progress in one calm learning space.</p></div>
    <nav>
      <button class="nav-btn active" data-view="home"><span>⌂</span>Home</button>
      <button class="nav-btn" data-view="blank"><span>ⓘ</span>About the book</button>
      <button class="nav-btn" data-view="blank"><span>◔</span>Progress</button>
      <button class="nav-btn" data-view="blank"><span>▤</span>My lessons</button>
      <button class="nav-btn" data-view="blank"><span>!</span>My mistakes</button>
      <button class="nav-btn" data-view="blank"><span>▦</span>Classes</button>
    </nav>
    <div class="side-note">A clean shell ready for future B2 materials.</div>
  </aside>
  <main>
    <section id="home">
      <div class="topbar"><div><div class="eyebrow">My learning platform</div><h1>Coursebook and materials</h1></div><div class="book-badge"><strong>Outcomes B2</strong><span>16 units · personal learning space</span></div></div>
      <div class="units-grid" id="units"></div>
      <section class="card">
        <div class="unit-hero"><div class="unit-title"><div><span class="unit-pill" id="unitLabel">Unit 1</span><h2 class="unit-main-title" id="unitTitle">Entertainment</h2></div></div><div class="categories" id="categories"></div></div>
        <div class="lessons"><div class="section-placeholder" aria-hidden="true"></div><div id="lessonRows"></div><div class="assessment"><button class="open-empty" aria-label="Open empty assessment page"></button></div></div>
      </section>
    </section>
    <section id="blank" class="placeholder" hidden><div class="bubble" aria-label="Empty section"></div></section>
  </main>
</div>
<div class="toast" id="toast">This page is ready for content.</div>
<script>
  const units=document.querySelector('#units'),label=document.querySelector('#unitLabel'),unitTitle=document.querySelector('#unitTitle'),categories=document.querySelector('#categories'),rows=document.querySelector('#lessonRows');
  const unitOneCategories=[
    {title:'Speaking',items:['Discuss how you spend your free time','Discuss different films and TV series','Talk about pictures and art']},
    {title:'Developing conversations',text:'Disagreeing politely'},
    {title:'Grammar',items:['Habits','Adjectives and adverbs']},
    {title:'Vocabulary',items:['Describing films, music and books','Plots','Talking about pictures']},
    {title:'Reading',items:['An article about the boom in non-English-language programming']},
    {title:'Listening',items:['Two people talk about films','A guide talks about paintings in an art gallery']}
  ];
  const unitOneLessons=[
    {code:'1A',title:'What kind of things are you into?'},
    {code:'1B',title:'It’s a big world out there'},
    {code:'1C',title:'In the picture'}
  ];
  function renderLessons(n){
    rows.innerHTML='';
    const lessons=n===1?unitOneLessons:[{},{},{}];
    lessons.forEach(lesson=>{const row=document.createElement('div');row.className='lesson-row';row.innerHTML=lesson.code?`<button class="ghost-btn lesson open-empty" aria-label="Open lesson ${lesson.code}">${lesson.code}. ${lesson.title}</button><div class="practice"><button class="ghost-btn soft open-empty" aria-label="Open homework ${lesson.code}">HW ${lesson.code}</button><button class="ghost-btn dashed open-empty" aria-label="Open additional exercises ${lesson.code}">Additional exercises<span class="optional-label">Optional · ${lesson.code}</span></button><button class="ghost-btn reference open-empty" aria-label="Open reference ${lesson.code}">Reference</button></div><button class="ghost-btn vocab open-empty" aria-label="Open vocabulary ${lesson.code}">Vocabulary</button>`:'<button class="ghost-btn lesson empty open-empty" aria-label="Open empty lesson page"></button><div class="practice"><button class="ghost-btn soft open-empty" aria-label="Open empty homework page"></button><button class="ghost-btn dashed open-empty" aria-label="Open empty additional exercises page"></button><button class="ghost-btn reference open-empty" aria-label="Open empty reference page"></button></div><button class="ghost-btn vocab open-empty" aria-label="Open empty vocabulary page"></button>';rows.append(row)});
  }
  function renderUnit(n){
    label.textContent=`Unit ${n}`;categories.innerHTML='';
    if(n===1){unitTitle.textContent='Entertainment';unitTitle.hidden=false;unitOneCategories.forEach(data=>{const c=document.createElement('div');c.className='category';c.innerHTML=`<h3>${data.title}</h3>${data.items?`<ul>${data.items.map(item=>`<li>${item}</li>`).join('')}</ul>`:`<p>${data.text}</p>`}`;categories.append(c)})}
    else{unitTitle.textContent='';unitTitle.hidden=true;for(let i=0;i<6;i++){const c=document.createElement('div');c.className='category empty';c.setAttribute('aria-label','Empty category');categories.append(c)}}
    renderLessons(n);
  }
  for(let n=1;n<=16;n++){const b=document.createElement('button');b.className='unit-chip'+(n===1?' active':'');b.innerHTML=n===1?`<span class="unit-number">Unit 1</span><span class="unit-chip-title">Entertainment</span>`:`<span class="unit-number">Unit ${n}</span><div class="blank-line"></div><div class="blank-line short"></div>`;b.onclick=()=>{document.querySelectorAll('.unit-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderUnit(n)};units.append(b)}
  renderUnit(1);
  const home=document.querySelector('#home'),blank=document.querySelector('#blank'),toast=document.querySelector('#toast');
  function showEmpty(){home.hidden=true;blank.hidden=false;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
  document.addEventListener('click',e=>{if(e.target.closest('.open-empty'))showEmpty()});
  document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const isHome=b.dataset.view==='home';home.hidden=!isHome;blank.hidden=isHome});
</script>
</body>
</html>
